# Static Application Security Testing (SAST) with Semgrep.
#
# Semgrep runs 100+ security rules for Python, SQL injection, XSS, secrets, etc.
# Fully open-source, free, and fast (~30s). More comprehensive than basic linters.
#
# Security hardening matches test.yml pattern.

name: SAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: >-
            p/security-audit
            p/python
            p/sql-injection
            p/xss
            p/secrets
        env:
          SEMGREP_RULES: auto
