# Auto-regenerate STATUS.md from live GitHub Issues on issue events.
#
# Runs whenever an issue is opened, closed, labeled, unlabeled, assigned,
# or unassigned. STATUS.md is published as a build artifact (status-md) on
# each run rather than committed to main — main is protected (PR-only +
# required checks), so a direct bot push is neither possible nor desired.
#
# Security: minimal permissions (read-only), pinned SHAs, no secrets in shell.

name: update-status

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, assigned, unassigned]
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: read  # checkout only; STATUS.md is published as an artifact, not committed
  issues: read    # needed for gh issue list

concurrency:
  group: update-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-status:
    name: Regenerate STATUS.md
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false  # no push; artifact-only

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Regenerate STATUS.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/update_status.py

      - name: Upload STATUS.md artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: status-md
          path: STATUS.md
          if-no-files-found: error
          retention-days: 30
