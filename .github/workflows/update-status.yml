# Auto-regenerate STATUS.md from live GitHub Issues on issue events.
#
# Runs whenever an issue is opened, closed, labeled, unlabeled, assigned,
# or unassigned — keeping STATUS.md in sync with real issue state.
#
# Security: minimal permissions, pinned SHA, no secrets interpolated into shell.

name: update-status

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, assigned, unassigned]
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write  # needed to commit STATUS.md back to the repo
  issues: read     # needed for gh issue list

concurrency:
  group: update-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-status:
    name: Regenerate STATUS.md
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: true  # needed for git push

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Regenerate STATUS.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/update_status.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          if git diff --cached --quiet; then
            echo "STATUS.md unchanged, nothing to commit"
          else
            git commit -m "chore: regenerate STATUS.md from issue state [skip ci]"
            git push
          fi
