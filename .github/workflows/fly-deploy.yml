# Deploy to Fly.io on push to main after all CI checks pass.
#
# Security hardening:
# - Actions pinned to commit SHA
# - Minimal permissions (contents: read)
# - Timeout limits
# - No credential persistence
#
# NOTE: This workflow runs independently. To enforce test workflow completion
# before deploy, enable branch protection on 'main' in GitHub settings and
# require status checks: "Lint", "Type check", "Tests", "Semgrep security scan"

name: Deploy to Fly.io

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only deploy after all CI checks pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@8c0d52278d2f89b82c87de16cc23283b8f0722bf  # v1.7

      - name: Deploy
        run: flyctl deploy --remote-only --app stoa-murmur
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
