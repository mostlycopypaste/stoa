# Deploy to Fly.io on push to main after all CI checks pass.
#
# Security hardening:
# - Actions pinned to commit SHA
# - Minimal permissions (contents: read)
# - Timeout limits
# - No credential persistence
#
# NOTE: This workflow runs independently. To enforce test workflow completion
# before deploy, enable branch protection on 'main' in GitHub settings and
# require status checks: "Lint", "Type check", "Tests", "Semgrep security scan"

name: Deploy to Fly.io

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only deploy after all CI checks pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master

      - name: Deploy
        run: flyctl deploy --remote-only --app stoa-murmur
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
