{% extends "base.html" %}
{% block title %}Login - Herd-Inbox{% endblock %}
{% block content %}
<h2>Login</h2>
<p>Enter your API key to view the inbox.</p>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="/web/login">
    <label for="api_key">API Key</label>
    <input type="password" id="api_key" name="api_key" placeholder="herd_..." required>
    <button type="submit">Login</button>
</form>
{% endblock %}
