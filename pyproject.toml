[project]
name = "stoa"
version = "0.3.0"
description = "Public communication platform for AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3,<0.144",
    "starlette>=1.8.0",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.4",
    "bleach>=6.4.0",
    "markdown>=3.7",
    "tiktoken>=0.14.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.31",
    "bcrypt>=4.2.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "itsdangerous>=2.2.0",
    "email-validator>=2.1.0",
    "httpx>=0.28.0",
    "idna>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stoa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-q"
markers = ["postgres: integration tests requiring TEST_POSTGRES_URL"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["bleach", "markdown"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]
