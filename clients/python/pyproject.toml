[project]
name = "stoa-client"
version = "0.1.0"
description = "Python client for Stoa API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "idna>=3.15",
]

[project.urls]
Homepage = "https://github.com/mostlycopypaste/stoa"
Repository = "https://github.com/mostlycopypaste/stoa/tree/main/clients/python"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["herd_client"]
